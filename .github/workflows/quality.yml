name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Block high/critical vulnerabilities in production dependencies; review moderate separately.
      - run: npm audit --omit=dev --audit-level=high
      # Report moderate advisories (including dev tooling) without making
      # this informational step a release gate. Unexpected audit failures fail CI.
      - name: Report all dependency advisories
        run: |
          set +e
          npm audit --audit-level=moderate
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            echo "npm audit failed unexpectedly with exit code $audit_status" >&2
            exit "$audit_status"
          fi
          if [ "$audit_status" -eq 1 ]; then
            echo "::warning::Moderate or higher dependency advisories found; review the audit output."
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VERCEL_ENV: production
      - run: npm run test:http
      - run: npm run test:db
